<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Cenového snipera</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: the Cenový sniper system is the map. A zoomable world of agent nodes fills the screen; a paper panel on the right explains the focused node. */
:root{
  --cobalt:#2f3fd6;   /* map ground */
  --cobalt-2:#4a58e0; /* grid dots, dim edges */
  --paper:#f6f1e7;    /* nodes, panel */
  --card:#fbf8f1;
  --sand:#e8e0cf;
  --ink:#16171c;
  --mute:#5c5c66;
  --amber:#ffb547;
  --lilac:#9aa6ff;
  --line:#c9c3b6;
  --display:'Archivo','Arial Black',Arial,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --panel-w:clamp(360px,36vw,640px);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--cobalt);color:var(--paper);font-family:var(--display);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

.stage{position:fixed;inset:0;overflow:hidden;background-color:var(--cobalt);background-image:radial-gradient(var(--cobalt-2) 2px,transparent 2.4px);background-size:44px 44px;touch-action:none}
.world{position:absolute;left:0;top:0;width:2280px;height:1100px;transform-origin:0 0;transition:transform .9s cubic-bezier(.22,.8,.2,1)}
.world.dragging{transition:none}
svg.edges{position:absolute;inset:0;width:2280px;height:1100px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--paper);stroke-width:3.5;stroke-dasharray:3 13;stroke-linecap:round;transition:opacity .5s}
.edge.mcp{stroke:var(--amber)}
.packet{fill:var(--amber)}

.frame{position:absolute;border:3px dashed rgba(246,241,231,.45);border-radius:36px;transition:opacity .5s,border-color .4s}
.frame .flabel{position:absolute;left:28px;top:-18px;background:var(--cobalt);padding:0 12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:20px;color:var(--paper)}
.frame.focus{border-color:var(--amber)}
.frame.focus .flabel{color:var(--amber)}

.node{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px;border:0;border-radius:18px;font-weight:800;font-size:32px;padding:0 26px;transition:opacity .5s,transform .5s,box-shadow .3s,background .3s;white-space:nowrap}
.node .plus{width:36px;height:36px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;font-size:26px;font-weight:900;flex:none}
.node .sub{display:block;font-size:17px;font-weight:600;opacity:.75;letter-spacing:.02em}
.node .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.n-paper{background:var(--paper);color:var(--ink)}
.n-ink{background:var(--ink);color:var(--paper)}
.n-amber{background:var(--amber);color:var(--ink)}
.n-amber .plus{background:var(--ink);color:var(--amber)}
.n-outline{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 3px var(--paper)}
.n-mcp{background:var(--cobalt);color:var(--amber);box-shadow:inset 0 0 0 3px var(--amber);font-size:24px;border-radius:14px}
.n-mcp .plus{background:var(--amber)}
.node:hover{transform:translateY(-3px)}
.node.focus{box-shadow:0 0 0 6px var(--amber),0 18px 40px rgba(10,12,40,.35)}
.node.n-amber.focus{box-shadow:0 0 0 6px var(--paper),0 18px 40px rgba(10,12,40,.35)}
.world.has-focus .node:not(.focus),.world.has-focus .edge{opacity:.45}
.world.has-focus .node:not(.focus):hover{opacity:.8}
.world.has-focus .edge.hot{opacity:1}
.m-single .multi,.m-multi .single{opacity:0!important;pointer-events:none;transform:scale(.85)}
.m-single .edge.multi,.m-multi .edge.single{opacity:0!important}

/* chrome */
.ui{position:fixed;z-index:3}
.crumb{left:clamp(16px,2.6vw,48px);top:calc(clamp(14px,3vh,40px) + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:8px 14px;white-space:nowrap;font-weight:700;font-size:clamp(13px,1vw,17px);background:rgba(246,241,231,.18);color:var(--paper);transition:background .2s,color .2s}
.chip:hover{background:rgba(246,241,231,.32)}
.chip.on{background:var(--amber);color:var(--ink)}
.chip.paper{background:var(--paper);color:var(--ink)}
.slash{opacity:.6;font-size:20px}
.modeSeg{display:inline-flex;background:var(--ink);border-radius:999px;padding:5px;gap:4px;margin-left:10px}
.modeSeg button{border:0;background:transparent;color:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700;font-size:clamp(12px,.9vw,15px)}
.modeSeg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.chapters{left:clamp(16px,2.6vw,48px);bottom:calc(clamp(14px,3vh,40px) + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:calc(100% - var(--panel-w) - 120px)}
.zoombtns{left:clamp(16px,2.6vw,48px);top:calc(clamp(70px,10vh,110px) + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.zoombtns button{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-weight:900;font-size:20px}
.title-ghost{left:clamp(16px,2.6vw,48px);top:calc(clamp(70px,10vh,110px) + env(safe-area-inset-top,0px));font-family:var(--mono);font-size:13px;opacity:.7;display:none}

/* panel */
.panel{right:clamp(16px,2vw,40px);top:calc(clamp(16px,3vh,40px) + env(safe-area-inset-top,0px));bottom:calc(clamp(16px,3vh,40px) + env(safe-area-inset-bottom,0px));width:var(--panel-w);background:var(--paper);color:var(--ink);border-radius:28px;box-shadow:0 30px 80px rgba(10,12,40,.35);display:flex;flex-direction:column;overflow:hidden}
.panel.ink{background:var(--ink);color:var(--paper)}
.p-body{flex:1;overflow-y:auto;padding:clamp(22px,2.4vw,44px);scrollbar-width:thin;min-height:0}
.p-inner{display:flex;flex-direction:column;gap:clamp(14px,1.8vh,24px)}
.p-inner.anim{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.p-foot{display:flex;align-items:center;gap:10px;padding:14px clamp(18px,2vw,32px);border-top:2px solid var(--sand)}
.ink .p-foot{border-top-color:#2b2c33}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:clamp(13px,.95vw,16px);background:var(--sand);color:var(--ink)}
.btn:hover{background:#ddd3bd}
.btn.primary{background:var(--ink);color:var(--paper)}
.ink .btn.primary{background:var(--amber);color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--amber)}
.count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.ink .count{color:#a3a6b0}

.eyebrow{font-weight:700;font-size:clamp(12px,.85vw,15px);letter-spacing:.2em;text-transform:uppercase;color:var(--cobalt)}
.ink .eyebrow{color:var(--amber)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(34px,3.6vw,68px);font-weight:900;line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
h2{font-size:clamp(28px,2.6vw,50px);font-weight:900;line-height:1;letter-spacing:-.025em}
p{margin:0}
.lead{font-size:clamp(16px,1.2vw,21px);line-height:1.45;font-weight:500}
.note{font-size:clamp(12px,.85vw,15px);color:var(--mute);line-height:1.4}
.ink .note{color:#a3a6b0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{border-radius:16px;padding:clamp(12px,1.1vw,18px);display:flex;flex-direction:column;gap:6px;min-width:0}
.mini h3{font-size:clamp(16px,1.2vw,21px);font-weight:800;line-height:1.15}
.mini p{font-size:clamp(13px,.95vw,16px);line-height:1.42}
.m-sand{background:var(--sand)} .m-ink{background:var(--ink);color:var(--paper)} .m-blue{background:var(--cobalt);color:var(--paper)} .m-amber{background:var(--amber);color:var(--ink)}
.ink .m-sand{background:#2b2c33;color:var(--paper)}
.num{font-weight:900;font-size:clamp(22px,1.8vw,34px);line-height:1;color:var(--cobalt)}
.m-ink .num,.m-blue .num{color:var(--amber)}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.code{background:var(--ink);color:var(--paper);border-radius:16px;padding:clamp(14px,1.2vw,22px);font-family:var(--mono);font-variant-ligatures:none;font-size:clamp(12px,.82vw,15px);line-height:1.6;overflow-x:auto;white-space:pre;margin:0}
.ink .code{background:#22242d}
.code .k{color:var(--lilac)} .code .s{color:var(--amber)} .code .c{color:#8b8f99}
.logos{display:flex;gap:10px;flex-wrap:wrap}
.logo{width:clamp(44px,3.6vw,64px);aspect-ratio:1;border-radius:50%;background:var(--sand);display:grid;place-items:center}
.logo svg{width:56%;height:56%}
.logo.hub{background:var(--ink)} .logo.hub svg path{fill:var(--paper)}
.gpu{width:min(100%,320px);height:auto}
.cycle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stagebox{border:0;text-align:left;border-radius:14px;padding:12px 14px;background:var(--sand);color:var(--ink);transition:background .25s,transform .25s}
.stagebox b{display:block;font-size:clamp(15px,1.15vw,20px)}
.stagebox span{font-size:clamp(12px,.85vw,14px);color:var(--mute)}
.stagebox[aria-pressed="true"]{background:var(--amber);transform:translateY(-3px)}
.stagebox[aria-pressed="true"] span{color:var(--ink)}
.meter{height:16px;border-radius:999px;background:var(--sand);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ff7a45);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-weight:900;font-size:19px}
.stepper output{font-weight:900;font-size:clamp(22px,1.8vw,34px);min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--amber);display:block;animation:pop .3s both}
.dots.ok i{background:var(--cobalt)}
@keyframes pop{from{transform:scale(0)}}
.tablewrap{overflow-x:auto;border-radius:14px;background:var(--card)}
table.cmp{border-collapse:collapse;width:100%;font-size:clamp(12px,.9vw,15.5px)}
table.cmp th,table.cmp td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{font-size:.8em;letter-spacing:.12em;text-transform:uppercase}
table.cmp td:first-child{font-weight:800;width:28%}
table.cmp .hl{background:var(--amber)}
.seg{display:inline-flex;background:var(--ink);border-radius:999px;padding:5px;gap:4px}
.seg button{border:0;background:transparent;color:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700;font-size:clamp(12px,.9vw,15px)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.big-play{width:clamp(72px,6vw,108px);aspect-ratio:1;border-radius:50%;background:var(--amber);border:0;display:grid;place-items:center;transition:transform .2s;flex:none}
.big-play:hover{transform:scale(1.06)}
.big-play svg{width:38%;margin-left:8%}
.log{font-family:var(--mono);font-size:clamp(12px,.85vw,15px);line-height:1.7;color:#c9c3b6;min-height:6em}
.refs{margin:0;padding-left:1.3em;display:grid;gap:10px;font-size:clamp(14px,1vw,17px);line-height:1.45}
.refs a{color:var(--cobalt)}
.n-a2a{background:transparent;color:var(--lilac);box-shadow:inset 0 0 0 3px var(--lilac)}
.n-a2a .plus{background:var(--lilac)}
.edge.hitl{stroke:var(--paper);stroke-dasharray:1 9}
.edge.a2a{stroke:var(--lilac)}
.arr{width:26px;height:14px;flex:none}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fp{border-radius:10px;padding:7px 12px;font-weight:700;font-size:clamp(12px,.9vw,15px)}
.fp.ink{background:var(--ink);color:var(--paper)} .fp.paper{background:var(--paper);color:var(--ink)} .fp.amber{background:var(--amber);color:var(--ink)} .fp.line{box-shadow:inset 0 0 0 2px currentColor}
.harness{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--cobalt);padding:10px;border-radius:16px}
.harness span,.harness b{background:var(--paper);border-radius:10px;padding:12px 8px;text-align:center;font-weight:700;font-size:clamp(11px,.85vw,14px);display:grid;place-items:center}
.harness b{background:var(--amber);font-size:clamp(18px,1.5vw,26px);font-weight:900}
.ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:clamp(13px,.95vw,16px);line-height:1.42}
.spectrum{position:relative;display:grid;gap:8px;padding-left:28px}
.spectrum::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:6px;border-radius:3px;background:linear-gradient(var(--cobalt),var(--amber))}
.sp-top,.sp-bot{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalt)}
.sp-bot{color:#a85600}
.sp-item{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--sand);border-radius:12px;padding:9px 14px}
.sp-item b{font-size:clamp(14px,1.05vw,18px)} .sp-item span{font-size:clamp(12px,.85vw,14px);color:var(--mute)}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--ink);color:var(--paper)}
.tl b{font-size:clamp(14px,1vw,17px)} .tl span{font-size:12px;opacity:.8}
.tl.fail{background:transparent;color:#a8321a;box-shadow:inset 0 0 0 2px #a8321a} .tl.rec{background:var(--amber);color:var(--ink)} .tl.done{background:var(--cobalt)}
.trio{display:grid;gap:6px} .trio span{background:#2b2c33;border-radius:10px;padding:8px 12px;font-weight:600;font-size:clamp(12px,.9vw,15px)}
.qrbox{display:flex;gap:18px;align-items:center;background:var(--ink);color:var(--paper);border-radius:18px;padding:16px;flex-wrap:wrap}
.qrbox h3{font-size:clamp(17px,1.3vw,23px);font-weight:800;margin-top:4px}
.qrbox .eyebrow{color:var(--amber)}
.qrbox .note{color:#a3a6b0;word-break:break-all;margin-top:6px}
#qr svg{width:clamp(130px,11vw,190px);height:auto;border-radius:10px;display:block;background:#fbf8f1}
#qr{flex:none;max-width:100%}
[hidden]{display:none!important}
.hint{right:calc(var(--panel-w) + clamp(32px,4vw,80px));top:calc(clamp(22px,3.6vh,48px) + env(safe-area-inset-top,0px));font-family:var(--mono);font-size:13px;opacity:.75;text-align:right;line-height:1.6}

@media (max-width:820px){
  body{overflow:auto}
  .stage{position:relative;height:56vh;inset:auto}
  .panel{position:relative;inset:auto;right:auto;top:auto;bottom:auto;width:auto;margin:12px 16px 16px;max-height:none}
  .crumb{top:12px;left:16px}
  .chapters{position:absolute;top:calc(56vh - 56px);bottom:auto;max-width:calc(100% - 32px);flex-wrap:nowrap;overflow-x:auto}
  .zoombtns{top:auto;bottom:auto;display:none}
  .hint{display:none}
  .modeSeg{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="stage" id="stage" aria-label="Mapa systému Cenový sniper">
  <div class="world m-multi" id="world">
    <svg class="edges" id="edges" viewBox="0 0 2280 1100" aria-hidden="true"></svg>
    <div class="frame multi" id="f-runtime" style="left:370px;top:200px;width:1500px;height:700px"><span class="flabel">Runtime: LangGraph alebo CrewAI</span></div>
  </div>
</div>

<div class="ui crumb">
  <button class="chip paper" id="overview">Mapa</button><span class="slash">/</span><span class="chip on" id="crumbCh">Úvod</span>
  <div class="modeSeg" role="group" aria-label="Počet agentov"><button data-m="single" aria-pressed="false">1 agent</button><button data-m="multi" aria-pressed="true">Tím (5)</button></div>
</div>
<div class="ui zoombtns"><button id="zin" aria-label="Priblížiť">+</button><button id="zout" aria-label="Oddialiť">&minus;</button></div>
<nav class="ui chapters" id="chapters" aria-label="Kapitoly"></nav>

<section class="ui panel" id="panel" aria-live="polite">
  <div class="p-body" id="pbody"></div>
  <div class="p-foot">
    <button class="btn" id="prev">Späť</button>
    <button class="btn primary" id="next">Ďalej</button>
    <span class="count" id="count"></span>
  </div>
</section>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

  /**

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

function edgePath(a,b){
  const A1=C(a),B1=C(b);
  if (b==='mcpB'||b==='human') return `M${A1.cx} ${A1.t} L${B1.cx} ${B1.b}`;
  if (b==='mcpA'||b==='ext') return `M${A1.cx} ${A1.b} L${B1.cx} ${B1.t}`;
  const x1=A1.r, y1=A1.cy, x2=B1.l, y2=B1.cy, mx=(x1+x2)/2;
  return `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
}

/* ---------- camera ---------- */
const $=id=>document.getElementById(id);
const stage=$('stage');
let cam={s:1,x:0,y:0};
function applyCam(){ world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`; }
function visibleRect(){
  const W=stage.clientWidth,H=stage.clientHeight, narrow=innerWidth<=820;
  const panelW = narrow?0:$('panel').offsetWidth + parseFloat(getComputedStyle($('panel')).right)+24;
  return {x:0,y:70,w:W-panelW,h:H-140};
}
function fitBox(b){
  const v=visibleRect(), pad=70;
  const minW=900,minH=560; if(b.w<minW){b.x-=(minW-b.w)/2;b.w=minW;} if(b.h<minH){b.y-=(minH-b.h)/2;b.h=minH;}
  const s=Math.min((v.w-pad*2)/b.w,(v.h-pad*2)/b.h,1.1);
  cam.s=Math.max(.2,s);
  cam.x=v.x+v.w/2-(b.x+b.w/2)*cam.s;
  cam.y=v.y+v.h/2-(b.y+b.h/2)*cam.s;
  applyCam();
}
function boxOf(ids, frame){
  if(!ids.length) return {x:40,y:40,w:2220,h:1020};
  let l=1e9,t=1e9,r=-1e9,b=-1e9;
  ids.forEach(id=>{const c=C(id); l=Math.min(l,c.l);t=Math.min(t,c.t);r=Math.max(r,c.r);b=Math.max(b,c.b);});
  if(frame){ l=Math.min(l,370);t=Math.min(t,200);r=Math.max(r,1870);b=Math.max(b,900); }
  return {x:l-40,y:t-40,w:r-l+80,h:b-t+80};
}

/* ---------- state ---------- */
let cur=0, mode='multi';
try{const s=parseInt(localStorage.getItem('sniper-map-step')); if(s>=0&&s<S.length) cur=s;}catch(e){}
const hm=location.hash.match(/^#zastavka(\d+)$/); if(hm){const k=parseInt(hm[1])-1; if(k>=0&&k<S.length) cur=k;}

function setMode(m){
  mode=m; world.classList.toggle('m-single',m==='single'); world.classList.toggle('m-multi',m==='multi');
  document.querySelectorAll('.modeSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===m));
}
function setFocus(ids, frame){
  world.classList.toggle('has-focus', ids.length>0);
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('focus', ids.includes(n.dataset.id)));
  document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('hot', ids.includes(e.dataset.a)&&ids.includes(e.dataset.b)));
  $('f-runtime').classList.toggle('focus', !!frame);
}
function go(i){
  i=Math.max(0,Math.min(S.length-1,i)); cur=i; const s=S[i];
  setMode(s.mode); setFocus(s.focus, s.frame);
  fitBox(boxOf(s.focus, s.frame));
  const p=$('panel'); p.classList.toggle('ink', !!s.ink);
  $('pbody').innerHTML=`<div class="p-inner anim">${s.html()}</div>`;
  $('pbody').scrollTop=0;
  if(s.react) bindCycle();
  if(s.after) s.after();
  $('count').textContent=`${i+1} / ${S.length}`;
  const ch=CH.find(c=>c.id===s.ch); $('crumbCh').textContent=ch.label;
  document.querySelectorAll('#chapters .chip').forEach(b=>b.classList.toggle('on', b.dataset.ch===s.ch));
  try{localStorage.setItem('sniper-map-step',i)}catch(e){}
  try{history.replaceState(null,'','#zastavka'+(i+1))}catch(e){}
}
$('chapters').innerHTML=CH.map(c=>`<button class="chip" data-ch="${c.id}">${c.label}</button>`).join('');


function fillQR(){
  try{
    if(!/^https?:$/.test(location.protocol) || window.self!==window.top || typeof qrcode!=='function') return;
    const url=location.href.split('#')[0];
    const q=qrcode(0,'M'); q.addData(url); q.make();
    $('qr').innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});
    $('qrurl').textContent=url.replace(/^https?:\/\//,'');
    $('qrbox').hidden=false;
  }catch(e){}
}
/* ---------- widgets ---------- */
function bindCycle(){
  document.querySelectorAll('#cycle .stagebox').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#cycle .stagebox').forEach(x=>x.setAttribute('aria-pressed', x===b));
    $('reactOut').innerHTML=REACT[b.dataset.k];
  }));
}
function bindSeg(segId, tableId){
  const g=$(segId); if(!g) return;
  g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const on=b.getAttribute('aria-pressed')!=='true';
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed',on);
    document.querySelectorAll(`#${tableId} td[data-c]`).forEach(td=>td.classList.toggle('hl', on && td.dataset.c===b.dataset.v));
    if(b.dataset.m && on){ setMode(b.dataset.m); const ids=b.dataset.m==='single'?['agent','mcpB','mcpA']:['router','bazos','alza','analytik','reporter']; setFocus(ids,b.dataset.m==='multi'); fitBox(boxOf(ids,b.dataset.m==='multi')); }
  }));
}
const MN={m:3,n:2};
function initMN(){
  const draw=()=>{ $('mOut').textContent=MN.m; $('nOut').textContent=MN.n; $('mxn').textContent=`${MN.m} × ${MN.n} = ${MN.m*MN.n}`; $('mpn').textContent=`${MN.m} + ${MN.n} = ${MN.m+MN.n}`; $('dMxN').innerHTML='<i></i>'.repeat(MN.m*MN.n); $('dMpN').innerHTML='<i></i>'.repeat(MN.m+MN.n); };
  document.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',()=>{ const d=b.dataset.d; MN[d]=Math.max(1,Math.min(10,MN[d]+parseInt(b.dataset.s))); draw(); }));
  draw();
}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function packet(a,b,dur){
  return new Promise(res=>{
    const path=document.querySelector(`.edge[data-a="${a}"][data-b="${b}"]`); if(!path){res();return;}
    const g=$('packets'); const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('r',13); c.setAttribute('class','packet'); g.appendChild(c);
    const L=path.getTotalLength(), back=(b==='mcpB'||b==='mcpA'); let t0=null;
    const step=ts=>{ if(t0===null) t0=ts; let k=Math.min(1,(ts-t0)/dur); if(back) k = k<.5? k*2 : 2-k*2;
      const p=path.getPointAtLength(L*k); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y);
      if((ts-t0)<dur) requestAnimationFrame(step); else { c.remove(); res(); } };
    requestAnimationFrame(step);
  });
}
let demoRunning=false;
function bindDemo(){
  const btn=$('play'); if(!btn) return;
  btn.addEventListener('click', async ()=>{
    if(demoRunning) return; demoRunning=true;
    const log=$('demoLog'), say=t=>{ if(document.body.contains(log)) log.innerHTML+=esc(t)+'<br>'; };
    log.innerHTML=''; setMode('multi'); setFocus([],false); fitBox(boxOf([],false));
    const lit=ids=>setFocus(ids,false);
    lit(['user','router']); say('user: "RTX 4070 do 450 €, nová alebo bazár"'); await packet('user','router',900);
    say('router: zdroje -> [bazos, alza]'); lit(['router','bazos','alza']);
    await Promise.all([packet('router','bazos',900),packet('router','alza',900)]);
    say('bazos_scout || alza_scout: mcp.call ...'); lit(['bazos','alza','mcpB','mcpA']);
    await Promise.all([packet('bazos','mcpB',1300),packet('alza','mcpA',1300)]);
    lit(['bazos','alza','analytik']); await Promise.all([packet('bazos','analytik',900),packet('alza','analytik',900)]);
    say('analytik: porovnáva cenu, stav, záruku'); lit(['analytik','reporter']); await packet('analytik','reporter',900);
    lit(['reporter','output']); await packet('reporter','output',900);
    lit(['output']); say('reporter: odporúčanie hotové'); demoRunning=false;
  });
}

/* ---------- input ---------- */
$('next').onclick=()=>go(cur+1);
$('prev').onclick=()=>go(cur-1);
$('overview').onclick=()=>{ setFocus([],false); fitBox(boxOf([],false)); };
$('chapters').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; go(S.findIndex(s=>s.ch===b.dataset.ch));});
document.querySelectorAll('.modeSeg button').forEach(b=>b.addEventListener('click',()=>{ setMode(b.dataset.m); const ids=b.dataset.m==='single'?['agent','mcpB','mcpA']:['router','bazos','alza','analytik','reporter']; setFocus(ids,b.dataset.m==='multi'); fitBox(boxOf(ids,b.dataset.m==='multi')); }));
world.addEventListener('click',e=>{
  const n=e.target.closest('.node'); if(!n||moved) return;
  const id=n.dataset.id;
  let i=S.findIndex((s,k)=>k>cur && s.focus.includes(id)); if(i<0) i=S.findIndex(s=>s.focus.includes(id));
  if(i>=0) go(i);
});
$('zin').onclick=()=>zoomAt(1.25); $('zout').onclick=()=>zoomAt(0.8);
function zoomAt(f,cx,cy){ const v=visibleRect(); cx=cx??v.w/2; cy=cy??(v.y+v.h/2); const ns=Math.max(.2,Math.min(2.2,cam.s*f)); cam.x=cx-(cx-cam.x)*(ns/cam.s); cam.y=cy-(cy-cam.y)*(ns/cam.s); cam.s=ns; applyCam(); }
stage.addEventListener('wheel',e=>{ e.preventDefault(); world.classList.add('dragging'); zoomAt(e.deltaY<0?1.1:0.9,e.clientX,e.clientY - stage.getBoundingClientRect().top); clearTimeout(wt); wt=setTimeout(()=>world.classList.remove('dragging'),120); },{passive:false});
let wt, drag=null, moved=false;
stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=false; });
addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>6){ moved=true; world.classList.add('dragging'); cam.x=drag.cx+dx; cam.y=drag.cy+dy; applyCam(); } });
addEventListener('pointerup',()=>{ drag=null; world.classList.remove('dragging'); setTimeout(()=>moved=false,0); });
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ if(e.target.closest('button')&&e.key===' ') return; e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='m'||e.key==='M'||e.key==='Escape'){ $('overview').click(); }
  else if(e.key==='f'||e.key==='F'){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(err){} }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(S.length-1); }
});
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const s=S[cur]; fitBox(boxOf(s.focus,s.frame)); },150); });
go(cur);
</script>
